# Grafana dashboard provisioning.
#
# Loads every dashboard JSON under /var/lib/grafana/dashboards on startup and
# keeps watching for changes. `foldersFromFilesStructure` is off — there is
# one flat folder, which is all a single-host stack needs.
apiVersion: 1

providers:
  - name: streamanator
    orgId: 1
    folder: Streamanator
    type: file
    disableDeletion: false
    # Allow edits in the UI, but they are overwritten from disk on restart —
    # the JSON in git is the source of truth, the UI is for experimentation.
    allowUiUpdates: true
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
